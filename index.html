<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade e Genero</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Verificador de Idade</h1>

    <section>

        <div id="div1">

            <p>
                <label for="txtano">Ano de Nascimento:</label>
                <input type="number" name="txtano" id="txtano" placeholder="Ex: 1990">
            </p>
            <p>
                Sexo:
                <input type="radio" name="radsex" id="masc" checked>
                <label for="masc">Masculino</label>
                <input type="radio" name="radsex" id="fem">
                <label for="fem">Feminino</label>
            </p>
            <p>
                <input type="button" value="Verificar" id="btnVerificar">
            </p>
        </div>

        <div id="div2">
            <span id="spanResultado">Preencha os dados acima e clique no botão "Verificar" para saber sua idade e
                gênero.</span>
        </div>

    </section>

    <footer>
        <p>&copy; Henrique Bonito</p>
    </footer>

</body>

</html>
